name: npm

on:
  push:
    branches: [main]
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

concurrency:
  group: npm-publish
  # Keep pending stable releases when more main pushes arrive (up to 100 queued runs).
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'tuuject/surowan'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Validate release ref and choose version
        id: release
        run: node scripts/npm-release.ts

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund

      - run: pnpm install --frozen-lockfile
      - run: pnpm run cli:check
      # Separate runs: a filter that matches no file exits non-zero, while vitest
      # ORs multiple filters and silently passes a stale one.
      - run: pnpm test test/invocations test/cli
      - run: pnpm test test/npm-release.test.ts

      # Change only the disposable checkout; the tag is the stable version source.
      - name: Set package version
        working-directory: packages/cli
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts --workspaces=false

      - name: Pack CLI
        run: pnpm --filter @tuuject/surowan-utils pack --pack-destination "$RUNNER_TEMP/npm-release"

      - name: Inspect publish payload
        env:
          DIST_TAG: ${{ steps.release.outputs.tag }}
        run: |
          packages=("$RUNNER_TEMP/npm-release/"*.tgz)
          test "${#packages[@]}" -eq 1
          npm stage publish "${packages[0]}" --dry-run --access public --tag "$DIST_TAG" --ignore-scripts

      # No npm token: npm exchanges this job's OIDC identity with the registry.
      # The trusted publisher only allows staging; a maintainer approves with 2FA.
      - name: Stage npm publish
        env:
          DIST_TAG: ${{ steps.release.outputs.tag }}
        run: |
          packages=("$RUNNER_TEMP/npm-release/"*.tgz)
          test "${#packages[@]}" -eq 1
          npm stage publish "${packages[0]}" --access public --tag "$DIST_TAG" --ignore-scripts --provenance
