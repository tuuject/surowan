name: Docker

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        # Version comes from packageManager in package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: TypeScript check
        run: pnpm run check

      - name: Tests
        run: pnpm test

      - name: Build admin panel
        run: pnpm run admin:build

      - name: Install Playwright chromium
        run: pnpm --filter plasticwan-admin-next exec playwright install --with-deps chromium

      - name: Admin panel E2E
        run: pnpm run admin:test:e2e

  # Every push builds the same multi-arch image so Dockerfile breakage shows up
  # on develop; only main and release tags log in, push, and create a release.
  build:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      packages: write
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      - name: Next version
        id: next
        run: echo "version=0.0.0-next-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Image name (lowercase)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ steps.next.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tags pushed with GITHUB_TOKEN do not trigger workflows, so this does not rebuild.
      - name: Create pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.next.outputs.version }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.next.outputs.version }}
        run: >-
          gh release create "$TAG"
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --prerelease
          --generate-notes
          --notes "Docker image: \`$IMAGE\`"

  # Each main push leaves an image tag, a git tag and a pre-release for the same
  # 0.0.0-next-* version. Keep the newest KEEP versions across the union of all
  # three, so a version missing from one place still ages out of the others.
  prune-next:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: prune-next
    permissions:
      contents: write
      packages: write
    env:
      KEEP: 20
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Select versions to drop
        id: select
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          owner="$GITHUB_REPOSITORY_OWNER"
          package="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          scope=users
          [ "$(gh api "users/$owner" --jq .type)" = Organization ] && scope=orgs
          version='^0\\.0\\.0-next-[0-9]{14}$'

          gh release list --repo "$GITHUB_REPOSITORY" --limit 10000 --json tagName \
            --jq ".[].tagName | ltrimstr(\"v\") | select(test(\"$version\"))" | sort > releases
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v0.0.0-next-" \
            --jq ".[].ref | ltrimstr(\"refs/tags/v\") | select(test(\"$version\"))" | sort > tags
          gh api --paginate "$scope/$owner/packages/container/$package/versions" \
            --jq ".[].metadata.container.tags[] | select(test(\"$version\"))" | sort > images

          # The fixed-width UTC timestamp makes lexical order chronological.
          sort -u releases tags images | sort -r | tail -n +"$((KEEP + 1))" | sort > drop
          echo "Dropping $(wc -l < drop) of $(sort -u releases tags images | wc -l) next versions:"
          cat drop
          echo "image-tags=$(comm -12 drop images | paste -sd, -)" >> "$GITHUB_OUTPUT"

      # Images go first: the package permission is the likeliest failure, and
      # stopping here leaves all three sets untouched.
      - name: Delete images
        if: steps.select.outputs.image-tags != ''
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          delete-tags: ${{ steps.select.outputs.image-tags }}

      - name: Delete releases and tags
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          for v in $(comm -12 drop releases); do
            gh release delete "v$v" --repo "$GITHUB_REPOSITORY" --yes
          done
          for v in $(comm -12 drop tags); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v$v"
          done
