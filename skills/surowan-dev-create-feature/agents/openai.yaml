interface:
  display_name: "Surowan Dev: Create Feature & Review PR"
  short_description: "开工前先 fetch origin/develop 建 feature worktree；PR 在 review worktree 审阅与合并"
  default_prompt: "用 $surowan-dev-create-feature 为本次改动建好工作树：先拉取 origin/develop 最新代码，在 ../<仓库文件夹名>.worktrees/feature/<feature 分支名> 建 worktree 并切过去，然后在该 worktree 内继续开发。如果是 review 或合并 PR，按 references/review-pr.md 在 ../<仓库文件夹名>.worktrees/review/pr-<N> 检出审阅。"
